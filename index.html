<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="google-adsense-account" content="ca-pub-5340852916888803">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro Caixa — Gestão da Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1B2D;
    --bg-2:#16273F;
    --paper:#FAF7EE;
    --paper-line:#E6DCC0;
    --ink:#1C1B18;
    --muted:#726B57;
    --gold:#D4A24C;
    --gold-dark:#B3823A;
    --teal:#2F6E56;
    --teal-soft:#E4EFE9;
    --red:#AE4038;
    --red-soft:#F5E4E2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    display:grid;
    grid-template-columns:220px 1fr;
    min-height:100vh;
  }
  /* SIDEBAR */
  .sidebar{
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
    color:#F1EEDF;
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:6px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-size:15px;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:2px;
  }
  .store-name-input{
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(241,238,223,.25);
    color:#F1EEDF;
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    padding:4px 0 10px 0;
    margin-bottom:22px;
    width:100%;
  }
  .store-name-input:focus{outline:none;border-bottom-color:var(--gold);}
  .nav-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background:transparent;
    border:none;
    color:#CFC9B4;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    text-align:left;
    padding:11px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .nav-btn .num{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--gold);
    opacity:.8;
    width:16px;
  }
  .nav-btn:hover{background:rgba(212,162,74,.08); color:#F1EEDF;}
  .nav-btn.active{background:rgba(212,162,74,.16); color:#F1EEDF;}
  .nav-btn.active .num{opacity:1;}
  .sidebar-foot{
    margin-top:auto;
    font-size:11px;
    color:#7C7863;
    line-height:1.5;
    border-top:1px solid rgba(241,238,223,.12);
    padding-top:14px;
  }
  /* MAIN / PAPER */
  .main{
    padding:34px 40px 60px;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 31px, var(--paper-line) 32px),
      var(--paper);
    background-attachment:local;
  }
  .page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:26px;
    flex-wrap:wrap;
    gap:10px;
  }
  .page-title{
    font-family:'Fraunces',serif;
    font-size:30px;
    font-weight:600;
    margin:0;
  }
  .page-sub{
    color:var(--muted);
    font-size:13.5px;
    margin-top:4px;
  }
  .today{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  /* DASHBOARD CARDS */
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:16px;
    margin-bottom:28px;
  }
  .card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .card-label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--muted);
    font-weight:600;
  }
  .card-value{
    font-family:'JetBrains Mono',monospace;
    font-size:26px;
    font-weight:700;
    margin-top:8px;
  }
  .card-value.pos{color:var(--teal);}
  .card-value.neg{color:var(--red);}
  .card-sub{font-size:12px;color:var(--muted);margin-top:4px;}

  .dash-row{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:20px;
    align-items:start;
  }
  @media(max-width:900px){ .dash-row{grid-template-columns:1fr;} }

  .panel{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:20px 22px;
  }
  .panel h3{
    font-family:'Fraunces',serif;
    font-size:17px;
    margin:0 0 14px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .stamp-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px 10px 10px;
  }
  .stamp{
    width:150px;height:150px;
    border-radius:50%;
    border:3px double var(--teal);
    color:var(--teal);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform:rotate(-9deg);
    font-family:'Fraunces',serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    opacity:.92;
  }
  .stamp.neg{border-color:var(--red); color:var(--red);}
  .stamp .s-label{font-size:15px;font-weight:700;}
  .stamp .s-margin{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;margin-top:2px;}
  .stamp .s-note{font-size:9.5px;letter-spacing:.08em;margin-top:2px;}

  .mini-row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px dashed var(--paper-line);
    font-size:13.5px;
  }
  .mini-row:last-child{border-bottom:none;}
  .mini-row .qty{font-family:'JetBrains Mono',monospace;color:var(--muted);}
  .low-tag{
    display:inline-block;
    background:var(--red-soft);
    color:var(--red);
    font-size:10.5px;
    font-weight:700;
    padding:1px 7px;
    border-radius:20px;
    margin-left:6px;
  }
  .empty{color:var(--muted);font-size:13px;padding:10px 0;}

  /* FORMS / TABLES */
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--gold-dark);
    background:var(--gold);
    color:#241C0B;
    cursor:pointer;
  }
  .btn:hover{background:var(--gold-dark);}
  .btn.secondary{
    background:transparent;
    border:1px solid var(--paper-line);
    color:var(--ink);
  }
  .btn.secondary:hover{background:var(--paper-line);}
  .btn.danger{border-color:var(--red); color:var(--red); background:transparent;}
  .btn.danger:hover{background:var(--red-soft);}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:6px;}

  .form-card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:20px;
  }
  .form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px;
  }
  label{
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    display:block;
    margin-bottom:5px;
  }
  input,select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:#FDFCF8;
  }
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  .form-actions{margin-top:16px;display:flex;gap:10px;}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);overflow:hidden;}
  thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    background:#F3EFDF;
    padding:11px 14px;
    border-bottom:1px solid var(--paper-line);
  }
  tbody td{
    padding:12px 14px;
    font-size:13.5px;
    border-bottom:1px solid var(--paper-line);
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF9F1;}
  td.num, th.num{font-family:'JetBrains Mono',monospace;text-align:right;}
  .stock-low{color:var(--red);font-weight:700;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .table-wrap{overflow-x:auto;}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;}

  /* ANIMAÇÕES */
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);} }
  @keyframes rowOut{ to{opacity:0; transform:translateX(10px) scale(.98);} }
  @media (prefers-reduced-motion: no-preference){
    .anim-in{animation:fadeInUp .38s cubic-bezier(.2,.7,.3,1) both;}
    .form-card.anim-in{animation:popIn .26s cubic-bezier(.2,.7,.3,1) both;}
    .anim-pop{animation:popIn .4s cubic-bezier(.2,.7,.3,1) both;}
    tbody tr{animation:fadeIn .32s ease both;}
    .mini-row{animation:fadeIn .32s ease both;}
    tbody tr.removing, .mini-row.removing{animation:rowOut .22s ease forwards;}
  }
  .card, .panel{transition:transform .18s ease, box-shadow .18s ease;}
  .card:hover, .panel:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,18,10,.07);}
  .btn{transition:background .15s ease, transform .12s ease, box-shadow .12s ease, border-color .15s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:scale(.95);}
  .nav-btn{transition:background .2s ease, color .2s ease, padding-left .2s ease;}
  .nav-btn:hover{padding-left:16px;}
  .stamp-wrap{overflow:hidden;}
  .stamp{transition:transform .35s cubic-bezier(.2,.7,.3,1);}
  .stamp-wrap:hover .stamp{transform:rotate(-9deg) scale(1.06);}
  input,select{transition:border-color .15s ease, box-shadow .15s ease;}
  input:focus,select:focus{box-shadow:0 0 0 3px rgba(212,162,74,.18);}
  tr, .mini-row{transition:background-color .15s ease;}

  /* CARRINHO DE VENDA (abre como painel lateral) */
  @keyframes slideInPanel{ from{transform:translateX(100%);} to{transform:translateX(0);} }
  @keyframes fadeInOverlay{ from{opacity:0;} to{opacity:1;} }
  .sale-overlay{
    position:fixed; inset:0; background:rgba(15,27,45,.45);
    display:none; justify-content:flex-end; z-index:50;
    animation:fadeInOverlay .2s ease both;
  }
  .sale-panel{
    width:min(480px, 100%); height:100%;
    background:var(--paper);
    border-left:1px solid var(--paper-line);
    box-shadow:-12px 0 30px rgba(15,27,45,.18);
    padding:26px 26px 24px;
    overflow-y:auto;
    animation:slideInPanel .28s cubic-bezier(.2,.7,.3,1) both;
  }
  .sale-panel-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .sale-panel-head h3{font-family:'Fraunces',serif; font-size:20px; margin:0;}
  .cart-add-row{
    display:grid; grid-template-columns:1fr 90px auto; gap:10px; align-items:end;
    margin-bottom:16px;
  }
  .cart-total{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Fraunces',serif; font-size:19px; font-weight:600;
    border-top:2px solid var(--ink); margin-top:14px; padding-top:12px;
  }
  .cart-total .val{font-family:'JetBrains Mono',monospace; color:var(--teal);}
  .cart-empty{color:var(--muted); font-size:13px; padding:14px 0;}
  @media(max-width:520px){
    .cart-add-row{grid-template-columns:1fr; }
  }


  .save-status{
    display:flex; align-items:center; gap:7px;
    font-size:11.5px; font-weight:600; color:#CFC9B4;
    margin-bottom:10px;
  }
  .save-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--teal); flex-shrink:0;
    box-shadow:0 0 0 3px rgba(47,110,86,.25);
    transition:background .2s ease, box-shadow .2s ease;
  }
  .save-status.dirty .save-dot{
    background:var(--gold);
    box-shadow:0 0 0 3px rgba(212,162,74,.28);
    animation:pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  /* VITRINE */
  .vitrine-note{
    font-size:13px; color:var(--muted); line-height:1.55;
    background:var(--teal-soft); border:1px solid rgba(47,110,86,.18);
    border-radius:8px; padding:12px 14px;
  }
  .listing-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:16px;
  }
  .listing-card{
    background:#fff; border:1px solid var(--paper-line); border-radius:var(--radius);
    padding:18px 20px; animation:fadeInUp .35s cubic-bezier(.2,.7,.3,1) both;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .listing-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,18,10,.07);}
  .listing-tag{
    display:inline-block; background:var(--teal-soft); color:var(--teal);
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 9px; border-radius:20px; margin-bottom:9px;
  }
  .listing-card h4{font-family:'Fraunces',serif; font-size:17px; margin:0 0 3px;}
  .listing-city{font-size:11.5px; color:var(--muted); margin-bottom:10px;}
  .listing-ad{font-size:13.5px; line-height:1.55; color:var(--ink); margin-bottom:10px; white-space:pre-wrap;}
  .listing-contact{font-size:12px; color:var(--muted); font-family:'JetBrains Mono',monospace;}

  .data-actions{display:flex; flex-direction:column; gap:6px;}
  .data-actions .btn{width:100%;}
  .data-note{font-size:10.5px; color:#7C7863; margin-top:10px; line-height:1.5;}

  @media(max-width:760px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:sticky; top:0; height:auto;
      flex-direction:row; align-items:center; overflow-x:auto;
      padding:14px 16px; gap:8px;
    }
    .brand,.store-name-input{display:none;}
    .sidebar-foot{
      margin-top:0; border-top:none; padding-top:0;
      flex-shrink:0; display:flex; align-items:center; gap:6px;
    }
    .data-actions{flex-direction:row;}
    .data-actions .btn{width:auto; white-space:nowrap;}
    .data-note{display:none;}
    .save-status{margin-bottom:0;}
    .save-status span:not(.save-dot){display:none;}
    .nav-btn{white-space:nowrap;}
    .main{padding:22px 18px 50px;}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand">Livro Caixa</div>
    <input id="storeNameInput" class="store-name-input" value="Minha Loja" />
    <button class="nav-btn active" data-tab="dashboard"><span class="num">01</span> Painel</button>
    <button class="nav-btn" data-tab="produtos"><span class="num">02</span> Produtos</button>
    <button class="nav-btn" data-tab="vendas"><span class="num">03</span> Vendas</button>
    <button class="nav-btn" data-tab="vitrine"><span class="num">04</span> Vitrine</button>
    <div class="sidebar-foot">
      <div class="save-status" id="saveStatus">
        <span class="save-dot" id="saveDot"></span>
        <span id="saveStatusText">Tudo exportado</span>
      </div>
      <div class="data-actions">
        <button class="btn secondary small" id="btnExport">⭳ Exportar arquivo</button>
        <button class="btn secondary small" id="btnImport">⭱ Importar arquivo</button>
        <input type="file" id="fileImport" accept="application/json" style="display:none;">
      </div>
      <div class="data-note">Exporte um arquivo .json para guardar junto da pasta do app. Ao tentar fechar a página com alterações não exportadas, o navegador vai avisar.</div>
    </div>
  </nav>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 class="page-title" id="pageTitle">Painel</h1>
        <div class="page-sub" id="pageSub">Visão geral de vendas, custos e lucro</div>
      </div>
      <div class="today" id="todayLabel"></div>
    </div>

    <section id="tab-dashboard"></section>
    <section id="tab-produtos" style="display:none;"></section>
    <section id="tab-vendas" style="display:none;"></section>
    <section id="tab-vitrine" style="display:none;"></section>
  </main>

  <div class="sale-overlay" id="saleOverlay">
    <div class="sale-panel" id="salePanel">
      <div class="sale-panel-head">
        <h3>Nova venda</h3>
        <button class="btn secondary small" id="cart-close">Fechar</button>
      </div>

      <div class="cart-add-row">
        <div><label>Produto</label><select id="cart-product"></select></div>
        <div><label>Qtd.</label><input id="cart-qty" type="number" min="1" step="1" value="1"></div>
        <button class="btn" id="cart-add">+ Adicionar</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Produto</th><th class="num">Qtd.</th><th class="num">Preço un.</th><th class="num">Subtotal</th><th></th></tr></thead>
          <tbody id="cart-items-body"></tbody>
        </table>
      </div>

      <div class="cart-total">
        <span>Total da venda</span>
        <span class="val" id="cart-total-value">R$ 0,00</span>
      </div>

      <div class="form-grid" style="margin-top:16px;">
        <div><label>Data da venda</label><input id="cart-date" type="date"></div>
      </div>

      <div class="form-actions">
        <button class="btn" id="cart-finish">Finalizar venda</button>
        <button class="btn secondary" id="cart-cancel">Cancelar</button>
      </div>
    </div>
  </div>

</div>

<script>
let products = [];
let sales = [];
let storeName = 'Minha Loja';
let activeTab = 'dashboard';
let hasUnsavedChanges = false;
let communityListings = [];
let myListingIds = [];

function markDirty(){
  hasUnsavedChanges = true;
  updateSaveIndicator();
}
function updateSaveIndicator(){
  const status = document.getElementById('saveStatus');
  const text = document.getElementById('saveStatusText');
  if(!status || !text) return;
  if(hasUnsavedChanges){
    status.classList.add('dirty');
    text.textContent = 'Alterações não exportadas';
  } else {
    status.classList.remove('dirty');
    text.textContent = 'Tudo exportado';
  }
}

window.addEventListener('beforeunload', (e)=>{
  if(hasUnsavedChanges){
    e.preventDefault();
    e.returnValue = 'Você tem alterações que ainda não foram exportadas para o arquivo. Deseja mesmo sair?';
    return e.returnValue;
  }
});

const fmt = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtNum = n => (n||0).toLocaleString('pt-BR');
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

async function saveProducts(){ try{ await window.storage.set('products', JSON.stringify(products)); markDirty(); }catch(e){ console.error(e); } }
async function saveSales(){ try{ await window.storage.set('sales', JSON.stringify(sales)); markDirty(); }catch(e){ console.error(e); } }
async function saveStoreName(){ try{ await window.storage.set('store_name', storeName); markDirty(); }catch(e){ console.error(e); } }
async function saveCommunityListings(){ try{ await window.storage.set('community_listings', JSON.stringify(communityListings), true); }catch(e){ console.error(e); } }
async function saveMyListingIds(){ try{ await window.storage.set('my_listing_ids', JSON.stringify(myListingIds)); }catch(e){ console.error(e); } }

function normalizeSales(raw){
  return (raw||[]).map(s=>{
    if(s.items) return s;
    const cost = s.unitCost*s.qty;
    return {
      id:s.id, date:s.date,
      items:[{productId:s.productId, productName:s.productName, qty:s.qty, unitPrice:s.unitPrice, unitCost:s.unitCost, subtotal:s.total}],
      total:s.total, cost, profit:s.total-cost
    };
  });
}

async function loadAll(){
  try{ const r = await window.storage.get('products'); products = r ? JSON.parse(r.value) : []; }catch(e){ products = []; }
  try{
    const r = await window.storage.get('sales');
    sales = normalizeSales(r ? JSON.parse(r.value) : []);
  }catch(e){ sales = []; }
  try{ const r = await window.storage.get('store_name'); storeName = r ? r.value : 'Minha Loja'; }catch(e){ storeName = 'Minha Loja'; }
  try{ const r = await window.storage.get('community_listings', true); communityListings = r ? JSON.parse(r.value) : []; }catch(e){ communityListings = []; }

  renderAll();
}

function animateIn(el){
  el.classList.remove('anim-in');
  void el.offsetWidth;
  el.classList.add('anim-in');
}

document.getElementById('btnExport').addEventListener('click', ()=>{
  const data = { storeName, products, sales, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `livro-caixa-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  hasUnsavedChanges = false;
  updateSaveIndicator();
});

document.getElementById('btnImport').addEventListener('click', ()=>{
  document.getElementById('fileImport').click();
});

document.getElementById('fileImport').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data.products) || !Array.isArray(data.sales)){
      alert('Arquivo inválido. Selecione um arquivo exportado por este app.');
      return;
    }
    if(!confirm('Importar este arquivo vai substituir os dados atuais neste app. Deseja continuar?')) return;
    products = data.products;
    sales = normalizeSales(data.sales);
    storeName = data.storeName || storeName;
    document.getElementById('storeNameInput').value = storeName;
    await saveProducts();
    await saveSales();
    await saveStoreName();
    hasUnsavedChanges = false;
    updateSaveIndicator();
    renderAll();
  }catch(err){
    alert('Não foi possível ler o arquivo. Verifique se é um arquivo .json exportado por este app.');
  }
  e.target.value = '';
});

function metrics(){
  let revenue=0, cost=0;
  sales.forEach(s=>{ revenue += s.total; cost += s.cost; });
  const profit = revenue - cost;
  const margin = revenue>0 ? (profit/revenue*100) : 0;
  return {revenue, cost, profit, margin, count:sales.length};
}

function renderAll(){
  if(activeTab==='dashboard') renderDashboard();
  if(activeTab==='produtos') renderProdutos();
  if(activeTab==='vendas') renderVendas();
  if(activeTab==='vitrine') renderVitrine();
}

/* Carrinho: abre como um painel lateral onde dá pra adicionar vários produtos numa mesma venda */
function cartAvailableStock(productId){
  const prod = products.find(p=>p.id===productId);
  if(!prod) return 0;
  const inCart = cart.filter(i=>i.productId===productId).reduce((a,i)=>a+i.qty,0);
  return prod.stock - inCart;
}

function openSaleOverlay(){
  cart = [];
  document.getElementById('cart-date').value = todayISO();
  renderCartProductSelect();
  renderCartItems();
  document.getElementById('saleOverlay').style.display = 'flex';
}

function closeSaleOverlay(){
  document.getElementById('saleOverlay').style.display = 'none';
  cart = [];
}

function renderCartProductSelect(){
  const sel = document.getElementById('cart-product');
  const current = sel.value;
  sel.innerHTML = `<option value="">Selecione...</option>` + products.map(p=>{
    const avail = cartAvailableStock(p.id);
    return `<option value="${p.id}" ${avail<=0?'disabled':''}>${p.name} (disponível: ${avail})</option>`;
  }).join('');
  if(current) sel.value = current;
}

function renderCartItems(){
  const body = document.getElementById('cart-items-body');
  if(!cart.length){
    body.innerHTML = `<tr><td colspan="5" class="cart-empty">Nenhum produto adicionado ainda. Escolha um produto acima e clique em "Adicionar".</td></tr>`;
  } else {
    body.innerHTML = cart.map((it,idx)=>`
      <tr>
        <td>${it.productName}</td>
        <td class="num">${it.qty}</td>
        <td class="num">${fmt(it.unitPrice)}</td>
        <td class="num">${fmt(it.unitPrice*it.qty)}</td>
        <td><div class="row-actions"><button class="btn danger small" data-cartremove="${idx}">Remover</button></div></td>
      </tr>
    `).join('');
    body.querySelectorAll('[data-cartremove]').forEach(b=>b.addEventListener('click', ()=>{
      cart.splice(parseInt(b.dataset.cartremove),1);
      renderCartProductSelect();
      renderCartItems();
    }));
  }
  const total = cart.reduce((a,it)=>a+it.unitPrice*it.qty,0);
  document.getElementById('cart-total-value').textContent = fmt(total);
}

document.getElementById('cart-close').addEventListener('click', closeSaleOverlay);
document.getElementById('cart-cancel').addEventListener('click', closeSaleOverlay);
document.getElementById('saleOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='saleOverlay') closeSaleOverlay();
});

document.getElementById('cart-add').addEventListener('click', ()=>{
  const pid = document.getElementById('cart-product').value;
  const qty = parseInt(document.getElementById('cart-qty').value)||0;
  if(!pid){ alert('Selecione um produto.'); return; }
  if(qty<=0){ alert('Informe uma quantidade válida.'); return; }
  const prod = products.find(p=>p.id===pid);
  if(!prod){ alert('Produto não encontrado.'); return; }
  const avail = cartAvailableStock(pid);
  if(qty > avail){ alert(`Estoque insuficiente. Disponível: ${avail} un.`); return; }

  const existing = cart.find(i=>i.productId===pid);
  if(existing){ existing.qty += qty; }
  else { cart.push({productId:prod.id, productName:prod.name, qty, unitPrice:prod.price, unitCost:prod.cost}); }

  document.getElementById('cart-qty').value = 1;
  renderCartProductSelect();
  renderCartItems();
});

document.getElementById('cart-finish').addEventListener('click', async ()=>{
  if(!cart.length){ alert('Adicione ao menos um produto à venda.'); return; }
  const date = document.getElementById('cart-date').value || todayISO();

  cart.forEach(it=>{
    const prod = products.find(p=>p.id===it.productId);
    if(prod) prod.stock -= it.qty;
  });

  const total = cart.reduce((a,it)=>a+it.unitPrice*it.qty,0);
  const cost = cart.reduce((a,it)=>a+it.unitCost*it.qty,0);
  sales.push({
    id: uid(), date,
    items: cart.map(it=>({...it, subtotal: it.unitPrice*it.qty})),
    total, cost, profit: total-cost
  });

  await saveProducts();
  await saveSales();
  closeSaleOverlay();
  renderVendas();
  if(activeTab==='dashboard') renderDashboard();
});

  wrap.innerHTML = `
    <div class="form-card anim-in">
      <div class="form-grid">
        <div><label>Nome da loja</label><input id="l-name" value="${storeName}" placeholder="Ex: Boutique da Ana"></div>
        <div><label>Categoria</label><input id="l-cat" placeholder="Ex: Vestuário, Alimentos, Pet shop"></div>
        <div><label>Cidade / Estado</label><input id="l-city" placeholder="Ex: Ribeira do Pombal, BA"></div>
        <div><label>Contato (opcional)</label><input id="l-contact" placeholder="WhatsApp, Instagram..."></div>
      </div>
      <div style="margin-top:14px;">
        <label>Anúncio</label>
        <textarea id="l-ad" rows="3" placeholder="Conte em poucas linhas o que sua loja vende ou uma promoção atual." style="width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:7px;font-family:'Inter',sans-serif;font-size:14px;background:#FDFCF8;resize:vertical;"></textarea>
      </div>
      <div class="hint">Este anúncio ficará público para todas as lojas que usam este sistema.</div>
      <div class="form-actions">
        <button class="btn" id="l-save">Publicar anúncio</button>
        <button class="btn secondary" id="l-cancel">Cancelar</button>
      </div>
    </div>
  `;
  document.getElementById('l-cancel').addEventListener('click', ()=>{ wrap.innerHTML=''; });
  document.getElementById('l-save').addEventListener('click', async ()=>{
    const name = document.getElementById('l-name').value.trim();
    const category = document.getElementById('l-cat').value.trim();
    const city = document.getElementById('l-city').value.trim();
    const contact = document.getElementById('l-contact').value.trim();
    const ad = document.getElementById('l-ad').value.trim();
    if(!name){ alert('Informe o nome da loja.'); return; }
    if(!ad){ alert('Escreva um breve anúncio sobre a loja.'); return; }
    const id = uid();
    communityListings.push({id, name, category, city, contact, ad, date: todayISO()});
    myListingIds.push(id);
    await saveCommunityListings();
    await saveMyListingIds();
    wrap.innerHTML = '';
    renderVitrine();
  });
}

loadAll();
</script>
</body>
</html>
